[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-comfyui"
version = "0.1.1"
description = "ComfyUI adapter for the DCC Model Context Protocol (MCP) ecosystem — bridges MCP tools to ComfyUI via REST + WebSocket API"
authors = [{ name = "Long Hao", email = "hal.long@outlook.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["comfyui", "stable-diffusion", "mcp", "dcc", "ai", "llm", "model-context-protocol", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "dcc-mcp-core>=0.20.6,<1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8.0",
    "hatchling",
    "build>=1.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-comfyui"
Repository = "https://github.com/dcc-mcp/dcc-mcp-comfyui"

[project.scripts]
dcc-mcp-comfyui = "dcc_mcp_comfyui.cli:main"

[project.entry-points."dcc_mcp.adapters"]
comfyui = "dcc_mcp_comfyui:ComfyUiMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_comfyui"]

[tool.hatch.build.targets.sdist]
exclude = [
    "docs/**/*.png",
    "docs/**/*.svg",
    "docs/**/*.webp",
    "/.venv",
    "/build",
    "/dist",
    "/venv",
    "/work",
    "/work-*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
