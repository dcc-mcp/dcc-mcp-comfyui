tools:
  - name: upload_image
    description: Upload one bounded local image to a validated ComfyUI storage area with SHA-256 provenance.
    source_file: scripts/upload_image.py
    execution: sync
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 180
    input_schema:
      type: object
      required: [source]
      properties:
        source: {type: string, minLength: 1, description: Absolute path to an existing regular image file.}
        subfolder: {type: string, maxLength: 512, default: ""}
        folder_type: {type: string, enum: [input, output, temp], default: input}
        overwrite: {type: boolean, default: false}
        max_file_bytes: {type: integer, minimum: 1, maximum: 536870912, default: 536870912}
    output_schema:
      type: object
      required: [success, message, context]
      properties: {success: {type: boolean}, message: {type: string}, context: {type: object}}
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: true}
    tags: [comfyui, image, upload, pipeline, destructive]
    call_examples:
      - arguments: {source: "C:/assets/reference.png", subfolder: dcc-mcp, overwrite: false}

  - name: download_artifact
    description: Prove prompt ownership and atomically download one bounded ComfyUI artifact.
    source_file: scripts/download_artifact.py
    execution: sync
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    input_schema:
      type: object
      required: [prompt_id, filename, target]
      properties:
        prompt_id: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}
        filename: {type: string, minLength: 1, maxLength: 512}
        target: {type: string, minLength: 1, description: Absolute destination path in an existing directory.}
        subfolder: {type: string, maxLength: 512, default: ""}
        folder_type: {type: string, enum: [input, output, temp], default: output}
        overwrite: {type: boolean, default: false}
        max_file_bytes: {type: integer, minimum: 1, maximum: 536870912, default: 536870912}
    output_schema:
      type: object
      required: [success, message, context]
      properties: {success: {type: boolean}, message: {type: string}, context: {type: object}}
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: true}
    tags: [comfyui, artifact, download, pipeline, destructive]
    call_examples:
      - arguments:
          prompt_id: 11111111-2222-3333-4444-555555555555
          filename: ComfyUI_00001_.png
          target: "C:/exports/ComfyUI_00001_.png"
