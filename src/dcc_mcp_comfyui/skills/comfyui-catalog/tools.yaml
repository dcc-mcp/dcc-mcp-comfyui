tools:
  - name: get_features
    description: Read the bounded ComfyUI feature manifest.
    source_file: scripts/get_features.py
    execution: sync
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    input_schema: {type: object, properties: {}}
    output_schema:
      type: object
      required: [success, message, context]
      properties: {success: {type: boolean}, message: {type: string}, context: {type: object}}
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: true}
    tags: [comfyui, catalog, read-only]

  - name: list_model_folders
    description: List bounded ComfyUI model-folder names without filesystem paths.
    source_file: scripts/list_model_folders.py
    execution: sync
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    input_schema:
      type: object
      properties: {limit: {type: integer, minimum: 1, maximum: 10000, default: 1000}}
    output_schema:
      type: object
      required: [success, message, context]
      properties: {success: {type: boolean}, message: {type: string}, context: {type: object}}
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: true}
    tags: [comfyui, models, read-only]

  - name: list_models
    description: List bounded model names from one exact ComfyUI model folder.
    source_file: scripts/list_models.py
    execution: sync
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    input_schema:
      type: object
      required: [folder]
      properties:
        folder: {type: string, minLength: 1, maxLength: 256}
        limit: {type: integer, minimum: 1, maximum: 10000, default: 1000}
    output_schema:
      type: object
      required: [success, message, context]
      properties: {success: {type: boolean}, message: {type: string}, context: {type: object}}
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: true}
    tags: [comfyui, models, read-only]
    call_examples:
      - arguments: {folder: checkpoints, limit: 200}
        note: List installed checkpoint model names.

  - name: list_embeddings
    description: List bounded ComfyUI embedding names.
    source_file: scripts/list_embeddings.py
    execution: sync
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    input_schema:
      type: object
      properties: {limit: {type: integer, minimum: 1, maximum: 10000, default: 1000}}
    output_schema:
      type: object
      required: [success, message, context]
      properties: {success: {type: boolean}, message: {type: string}, context: {type: object}}
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: true}
    tags: [comfyui, embeddings, read-only]

  - name: list_node_types
    description: Search bounded ComfyUI node summaries without returning full contracts.
    source_file: scripts/list_node_types.py
    execution: sync
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    input_schema:
      type: object
      properties:
        query: {type: string, maxLength: 256, default: ""}
        category: {type: string, maxLength: 256, default: ""}
        limit: {type: integer, minimum: 1, maximum: 10000, default: 200}
    output_schema:
      type: object
      required: [success, message, context]
      properties: {success: {type: boolean}, message: {type: string}, context: {type: object}}
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: true}
    tags: [comfyui, nodes, read-only]
    call_examples:
      - arguments: {query: sampler, limit: 50}
        note: Find sampler-related node summaries.

  - name: get_node_type
    description: Read the full live contract for one exact ComfyUI node class.
    source_file: scripts/get_node_type.py
    execution: sync
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    input_schema:
      type: object
      required: [node_class]
      properties: {node_class: {type: string, minLength: 1, maxLength: 256}}
    output_schema:
      type: object
      required: [success, message, context]
      properties: {success: {type: boolean}, message: {type: string}, context: {type: object}}
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: true}
    tags: [comfyui, nodes, contract, read-only]
    call_examples:
      - arguments: {node_class: KSampler}

  - name: get_runtime_status
    description: Read allowlisted ComfyUI runtime and device diagnostics without argv or local paths.
    source_file: scripts/get_runtime_status.py
    execution: sync
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    input_schema: {type: object, properties: {}}
    output_schema:
      type: object
      required: [success, message, context]
      properties: {success: {type: boolean}, message: {type: string}, context: {type: object}}
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: true}
    tags: [comfyui, diagnostics, read-only]
