tools:
  - name: validate_workflow
    description: Validate a ComfyUI API-format prompt against the running ComfyUI instance.
    source_file: scripts/validate_workflow.py
    execution: sync
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    input_schema:
      type: object
      required: [workflow]
      properties:
        workflow:
          type: object
          minProperties: 1
          description: Prompt JSON exported by ComfyUI using Save API Format.
    output_schema:
      type: object
      required: [success, message, context]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
          required: [validation]
          properties:
            validation:
              type: object
              required: [valid, errors, warnings, node_count]
              additionalProperties: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true
    tags: [comfyui, workflow, validation]

  - name: submit_workflow
    description: Submit a validated ComfyUI API-format prompt for queue execution.
    source_file: scripts/submit_workflow.py
    execution: sync
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    input_schema:
      type: object
      required: [workflow]
      properties:
        workflow:
          type: object
          minProperties: 1
          description: Prompt JSON exported by ComfyUI using Save API Format.
        wait:
          type: boolean
          default: false
          description: Wait for the prompt to reach a terminal state.
        timeout:
          type: number
          minimum: 1
          maximum: 600
          default: 120
          description: Maximum wait in seconds when wait is true.
    output_schema:
      type: object
      required: [success, message, context]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
          required: [prompt_id, number, node_errors]
          properties:
            prompt_id:
              type: [string, "null"]
            number:
              type: integer
            node_errors:
              type: object
          additionalProperties: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: true
    tags: [comfyui, workflow, queue, execution]

  - name: stage_3d_asset
    description: Publish a versioned 3D export from the configured sync source root into ComfyUI input/3d for Load3D.
    source_file: scripts/stage_3d_asset.py
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    input_schema:
      type: object
      required: [source_name, channel_id, asset_id, format]
      properties:
        source_name:
          type: string
          minLength: 1
          maxLength: 512
          description: Relative export path beneath DCC_MCP_COMFYUI_SYNC_SOURCE_ROOT.
        channel_id:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,128}$"
        asset_id:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,128}$"
        format:
          type: string
          enum: [obj, glb, gltf, fbx, stl]
        expected_head_revision:
          type: integer
          minimum: 0
          default: 0
          description: Optimistic concurrency precondition; zero requires an unpublished asset.
        source_instance_id:
          type: [string, "null"]
          maxLength: 128
          default: null
    output_schema:
      type: object
      required: [success, message, context]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
          required: [revision, input_name, url]
          properties:
            revision:
              type: object
              required: [channel_id, asset_id, revision, digest, file_ref]
              additionalProperties: true
            input_name:
              type: string
            url:
              type: string
          additionalProperties: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    tags: [comfyui, asset, sync, 3d, load3d]

  - name: query_job_status
    description: Query the execution state, outputs, and artifacts of a ComfyUI prompt.
    source_file: scripts/query_job_status.py
    execution: sync
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    input_schema:
      type: object
      required: [prompt_id]
      properties:
        prompt_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
          description: Prompt ID returned by submit_workflow.
    output_schema:
      type: object
      required: [success, message, context]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
          required: [prompt_id, done, status, outputs, artifacts]
          additionalProperties: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true
    tags: [comfyui, workflow, queue, status]

  - name: get_artifact
    description: Prove prompt ownership and return the URL for one exact ComfyUI artifact.
    source_file: scripts/get_artifact.py
    execution: sync
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    input_schema:
      type: object
      required: [prompt_id, filename]
      properties:
        prompt_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
          description: Prompt ID returned by submit_workflow.
        filename:
          type: string
          minLength: 1
          description: Output filename returned by query_job_status.
        subfolder:
          type: string
          default: ""
          description: Output subfolder returned by ComfyUI.
        folder_type:
          type: string
          enum: [output, input, temp]
          default: output
          description: ComfyUI storage area for the artifact.
    output_schema:
      type: object
      required: [success, message, context]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
          required: [prompt_id, filename, subfolder, folder_type, url]
          additionalProperties: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true
    tags: [comfyui, workflow, artifact, image]
