name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "release-please--branches--**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  COMFYUI_REF: c2bcbecd82ec5ae66594340b395c24ef0217b238

jobs:
  test:
    name: Test Python ${{ matrix.python }} / Core ${{ matrix.core-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10", core-version: "0.20.8"}
          - {os: ubuntu-latest, python: "3.13", core-version: "0.20.19"}
          - {os: windows-latest, python: "3.12", core-version: "0.20.19"}
          - {os: macos-latest, python: "3.12", core-version: "0.20.19"}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install resolved adapter and Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "dcc-mcp-core==${{ matrix.core-version }}"
      - name: Verify resolved dependency versions
        env:
          EXPECTED_CORE: ${{ matrix.core-version }}
        run: |
          python -m pip check
          python scripts/ci/check_uv_lock.py --installed
      - name: Run tests
        run: python -m pytest

  lint-and-build:
    name: Lint, package, and validate Skills
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install resolved build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "dcc-mcp-core==0.20.19"
          python -m pip check
      - name: Check generated lock projection
        run: python scripts/ci/check_uv_lock.py
      - name: Run Ruff checks
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Validate bundled Skills
        run: python scripts/ci/lint_skills.py
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke test the built wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          python -c "import importlib.metadata as m, importlib.resources as r, dcc_mcp_comfyui as p; assert p.__version__ == m.version('dcc-mcp-comfyui'); root = r.files('dcc_mcp_comfyui'); assert root.joinpath('skill_runtime.py').is_file(); assert root.joinpath('comfyui_custom_nodes', 'dcc_mcp_sync', 'web', 'dcc_mcp_sync.js').is_file(); assert root.joinpath('schemas', 'adapter-install-sop-v1.schema.json').is_file(); expected = {'comfyui-workflow': 5, 'comfyui-catalog': 7, 'comfyui-queue': 4, 'comfyui-assets': 2, 'comfyui-game-assets': 3}; import yaml; actual = {name: len(yaml.safe_load(root.joinpath('skills', name, 'tools.yaml').read_text(encoding='utf-8'))['tools']) for name in expected}; assert actual == expected, actual; from dcc_mcp_comfyui.game_assets import list_asset_recipes; assert len(list_asset_recipes()) == 9"
          python -c "import importlib.metadata as m, subprocess; expected = m.version('dcc-mcp-comfyui'); actual = subprocess.check_output(['dcc-mcp-comfyui', '--version'], text=True).strip(); assert actual == expected, (actual, expected)"

  comfyui-integration:
    name: ComfyUI v0.32.0 asset sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Comfy-Org/ComfyUI
          ref: ${{ env.COMFYUI_REF }}
          path: .ci/ComfyUI
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .ci/ComfyUI/requirements.txt
      - name: Install ComfyUI and resolved adapter contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r .ci/ComfyUI/requirements.txt
          python -m pip install -e . "dcc-mcp-core==0.20.19"
          python -m pip check

          python_executable="$(python -c 'import sys; print(sys.executable)')"
          receipt="$GITHUB_WORKSPACE/.ci/comfyui-receipt.json"
          common=(--json --dcc-path "$GITHUB_WORKSPACE/.ci/ComfyUI" --python "$python_executable" --receipt-path "$receipt")
          dcc-mcp-comfyui install --dry-run "${common[@]}" > .ci/install-plan.json

          set +e
          dcc-mcp-comfyui install --yes "${common[@]}" > .ci/install.json
          install_exit=$?
          set -e
          test "$install_exit" -eq 50
          dcc-mcp-comfyui status --json --receipt-path "$receipt" > .ci/status.json
          dcc-mcp-comfyui uninstall --yes --json --receipt-path "$receipt" > .ci/uninstall.json
          test ! -e .ci/ComfyUI/custom_nodes/dcc_mcp_sync
          test ! -e "$receipt"

          set +e
          dcc-mcp-comfyui install --yes "${common[@]}" > .ci/final-install.json
          install_exit=$?
          set -e
          test "$install_exit" -eq 50
          python -c "import json; reports = [json.load(open(path, encoding='utf-8')) for path in ('.ci/install-plan.json', '.ci/install.json', '.ci/status.json', '.ci/uninstall.json', '.ci/final-install.json')]; assert all(report['schema_version'] == 1 for report in reports); assert reports[2]['install_state'] == 'installed'; assert reports[3]['install_state'] == 'fresh'"
      - name: Start ComfyUI and verify 3D asset sync
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/dcc-mcp-source"
          input_root="$RUNNER_TEMP/comfyui-input"
          mkdir -p "$source_root" "$input_root"
          python .ci/ComfyUI/main.py \
            --cpu \
            --listen 127.0.0.1 \
            --port 8188 \
            --input-directory "$input_root" \
            --disable-auto-launch \
            > "$RUNNER_TEMP/comfyui.log" 2>&1 &
          comfyui_pid=$!
          trap 'kill "$comfyui_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 120); do
            if curl --fail --silent --show-error http://127.0.0.1:8188/system_stats > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$comfyui_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/comfyui.log"
            exit 1
          fi

          dcc-mcp-comfyui doctor --json \
            --comfyui-base-url http://127.0.0.1:8188 \
            --python "$(command -v python)" \
            --receipt-path "$GITHUB_WORKSPACE/.ci/comfyui-receipt.json" \
            --sync-source-root "$source_root" \
            --input-dir "$input_root" \
            > "$RUNNER_TEMP/comfyui-doctor.json"
          python -c "import json, os; report = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'comfyui-doctor.json'), encoding='utf-8')); assert report['verify']['directly_usable'] is True; assert report['connectivity']['sync_node_ready'] is True; assert report['connectivity']['comfyui_version'] == '0.32.0'"

          python scripts/ci_comfyui_smoke.py \
            --base-url http://127.0.0.1:8188 \
            --source-root "$source_root" \
            --input-root "$input_root"

  recipe-integration:
    name: Native recipe contracts and image roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Comfy-Org/ComfyUI
          ref: acb2a019b24861d89721a23862c059e3a6ece660
          path: .ci/ComfyUI
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .ci/ComfyUI/requirements.txt
      - name: Install pinned native ComfyUI on CPU
        run: |
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r .ci/ComfyUI/requirements.txt
          python -m pip install -e . "dcc-mcp-core==0.20.19"
          python -m pip check
      - name: Validate real node contracts without model weights
        shell: bash
        run: |
          set -euo pipefail
          python .ci/ComfyUI/main.py --cpu --listen 127.0.0.1 --port 8188 --disable-auto-launch > "$RUNNER_TEMP/recipe-comfyui.log" 2>&1 &
          comfyui_pid=$!
          trap 'kill "$comfyui_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8188/system_stats > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$comfyui_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat "$RUNNER_TEMP/recipe-comfyui.log"; exit 1; fi
          python scripts/ci_comfyui_recipe_smoke.py --base-url http://127.0.0.1:8188
